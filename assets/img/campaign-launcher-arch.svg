<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" role="img" aria-label="Flow diagram. Three input grids — products, keywords, and search-term gaps — feed into a validation stage of eight hard rules. Validated data passes to the generation engine, which expands each product into five parallel campaign types: Auto, Broad, Phrase, Exact, and product-page targeting. All five converge into a single bulk export as .xlsx or .csv, ready to upload to Amazon.">
<title>Campaign Launcher data flow: input grids to validation to generation engine to five campaign types to bulk export</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4a545e"/>
  </marker>
  <style>
    .box { fill: #e7f0ef; stroke: #0f5c5a; stroke-width: 1.5; }
    .box-dark { fill: #0f5c5a; stroke: #0a3f3e; stroke-width: 1.5; }
    .lbl { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #14181c; }
    .lbl-light { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #fbfaf8; }
    .sub { font-family: ui-monospace, Consolas, monospace; fill: #4a545e; }
    .sub-light { font-family: ui-monospace, Consolas, monospace; fill: #e7f0ef; }
    .type { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #0a3f3e; }
    .flow { stroke: #4a545e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .rail { stroke: #4a545e; stroke-width: 1.25; fill: none; }
  </style>
</defs>

<!-- Input grids -->
<rect class="box" x="10" y="8" width="380" height="52" rx="4"/>
<text class="lbl" x="200" y="30" font-size="16" text-anchor="middle">Input grids</text>
<text class="sub" x="200" y="49" font-size="11" text-anchor="middle">products · keywords · search-term gaps</text>

<path class="flow" d="M200,60 L200,80"/>

<!-- Validation -->
<rect class="box" x="10" y="80" width="380" height="42" rx="4"/>
<text class="lbl" x="200" y="106" font-size="16" text-anchor="middle">Validation — 8 rules</text>

<path class="flow" d="M200,122 L200,142"/>

<!-- Generation engine -->
<rect class="box-dark" x="10" y="142" width="380" height="42" rx="4"/>
<text class="lbl-light" x="200" y="168" font-size="16" text-anchor="middle">Generation engine</text>

<!-- Fan-out: stub from engine down to a distribution rail, then a stub with
     an arrowhead into each of the five campaign-type boxes -->
<path class="rail" d="M200,184 L200,196"/>
<path class="rail" d="M45,196 L354,196"/>
<path class="flow" d="M45,196 L45,208"/>
<path class="flow" d="M122,196 L122,208"/>
<path class="flow" d="M199,196 L199,208"/>
<path class="flow" d="M276,196 L276,208"/>
<path class="flow" d="M354,196 L354,208"/>

<!-- Five campaign types -->
<g>
  <rect class="box" x="10" y="208" width="70" height="48" rx="4"/>
  <text class="type" x="45" y="237" font-size="11" text-anchor="middle">Auto</text>

  <rect class="box" x="87" y="208" width="70" height="48" rx="4"/>
  <text class="type" x="122" y="237" font-size="11" text-anchor="middle">Broad</text>

  <rect class="box" x="164" y="208" width="70" height="48" rx="4"/>
  <text class="type" x="199" y="237" font-size="11" text-anchor="middle">Phrase</text>

  <rect class="box" x="241" y="208" width="70" height="48" rx="4"/>
  <text class="type" x="276" y="237" font-size="11" text-anchor="middle">Exact</text>

  <rect class="box" x="318" y="208" width="72" height="48" rx="4"/>
  <text class="type" x="354" y="231" font-size="10.5" text-anchor="middle">Product</text>
  <text class="type" x="354" y="244" font-size="10.5" text-anchor="middle">page</text>
</g>

<!-- Convergence: a stub from each box down to a collection rail, then one
     final stub with an arrowhead into bulk export -->
<path class="rail" d="M45,256 L45,268"/>
<path class="rail" d="M122,256 L122,268"/>
<path class="rail" d="M199,256 L199,268"/>
<path class="rail" d="M276,256 L276,268"/>
<path class="rail" d="M354,256 L354,268"/>
<path class="rail" d="M45,268 L354,268"/>
<path class="flow" d="M200,268 L200,280"/>

<!-- Bulk export -->
<rect class="box-dark" x="10" y="280" width="380" height="52" rx="4"/>
<text class="lbl-light" x="200" y="302" font-size="16" text-anchor="middle">Bulk export</text>
<text class="sub-light" x="200" y="321" font-size="11" text-anchor="middle">.xlsx (ExcelJS) · .csv (RFC 4180)</text>
</svg>
