<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 416" role="img" aria-label="Flow diagram. Bulk export files feed a central-directory zip read, which reads the archive's end-of-archive index up front and decompresses only the sheets it needs, instead of scanning forward for each entry the way a naive reader would. That feeds a SAX-streamed parse that holds constant memory regardless of sheet size. Parsed rows are grouped by product identifier, customer search term, and match type. Groups served by two or more distinct keyword texts are flagged as cannibalisation. The result splits into two outputs: a three-sheet Excel report for human review, and an upload-ready pause file that reproduces each selected keyword's real campaign row, matched by keyword ID.">
<title>Search term audit pipeline: bulk export files to central-directory zip read to SAX parse to grouping to flagging to two outputs</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#4a545e"/>
  </marker>
  <style>
    .box { fill: #e7f0ef; stroke: #0f5c5a; stroke-width: 1.5; }
    .box-dark { fill: #0f5c5a; stroke: #0a3f3e; stroke-width: 1.5; }
    .lbl { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #14181c; }
    .lbl-light { font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; fill: #fbfaf8; }
    .sub { font-family: ui-monospace, Consolas, monospace; fill: #4a545e; }
    .sub-light { font-family: ui-monospace, Consolas, monospace; fill: #e7f0ef; }
    .flow { stroke: #4a545e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .rail { stroke: #4a545e; stroke-width: 1.25; fill: none; }
  </style>
</defs>

<!-- Bulk export files -->
<rect class="box" x="10" y="8" width="380" height="56" rx="4"/>
<text class="lbl" x="200" y="30" font-size="16" text-anchor="middle">Bulk export files</text>
<text class="sub" x="200" y="49" font-size="11" text-anchor="middle">search-term and campaign sheets, per account</text>

<path class="flow" d="M200,64 L200,84"/>

<!-- Central-directory zip read -->
<rect class="box-dark" x="10" y="84" width="380" height="56" rx="4"/>
<text class="lbl-light" x="200" y="106" font-size="16" text-anchor="middle">Central-directory zip read</text>
<text class="sub-light" x="200" y="125" font-size="11" text-anchor="middle">reads end-of-archive index · decompresses only needed sheets</text>

<path class="flow" d="M200,140 L200,160"/>

<!-- SAX-streamed parse -->
<rect class="box" x="10" y="160" width="380" height="44" rx="4"/>
<text class="lbl" x="200" y="187" font-size="15" text-anchor="middle">SAX-streamed parse — constant memory</text>

<path class="flow" d="M200,204 L200,224"/>

<!-- Group -->
<rect class="box" x="10" y="224" width="380" height="44" rx="4"/>
<text class="lbl" x="200" y="251" font-size="14" text-anchor="middle">Group by product + search term + match type</text>

<path class="flow" d="M200,268 L200,288"/>

<!-- Flag -->
<rect class="box-dark" x="10" y="288" width="380" height="44" rx="4"/>
<text class="lbl-light" x="200" y="315" font-size="14" text-anchor="middle">Flag groups served by 2+ distinct keywords</text>

<!-- Fan-out to two outputs -->
<path class="rail" d="M200,332 L200,344"/>
<path class="rail" d="M102.5,344 L297.5,344"/>
<path class="flow" d="M102.5,344 L102.5,356"/>
<path class="flow" d="M297.5,344 L297.5,356"/>

<!-- Two outputs -->
<rect class="box" x="10" y="356" width="185" height="50" rx="4"/>
<text class="lbl" x="102.5" y="378" font-size="13" text-anchor="middle">Excel report</text>
<text class="sub" x="102.5" y="395" font-size="10" text-anchor="middle">3 sheets, for review</text>

<rect class="box" x="205" y="356" width="185" height="50" rx="4"/>
<text class="lbl" x="297.5" y="378" font-size="13" text-anchor="middle">Pause file</text>
<text class="sub" x="297.5" y="391" font-size="10" text-anchor="middle"><tspan x="297.5" dy="0">upload-ready,</tspan><tspan x="297.5" dy="11">matched by keyword ID</tspan></text>
</svg>
